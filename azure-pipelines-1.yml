trigger: none

pool: Docker-VM_Pool

stages:
- stage: Build_Image
  displayName: Build Docker Image
  jobs:
  - job: Build
    displayName: Build React Docker Image
    steps:
    - task: DockerInstaller@0
      inputs:
        dockerVersion: '17.09.0-ce'
    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: |
          docker build -t axion-app:$(Build.BuildId) .
    
    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: |
          mkdir -p $(Build.ArtifactStagingDirectory)
          docker save axion-app:$(Build.BuildId) -o $(Build.ArtifactStagingDirectory)/axion-app.tar


    - task: PublishPipelineArtifact@1
      displayName: Publish Docker Image Artifact
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/axion-app.tar'
        artifact: 'docker-image'
        publishLocation: 'pipeline'